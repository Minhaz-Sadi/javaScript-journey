<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Async JS</h1>
    <button id="stop">stop</button>
</body>
<script>
    // setTimeout(function(){
    //     console.log("Sadi");
    // }, 2000); // takes 2 minutes to exucute or print 

    const saySadi = function(){
        console.log("Sadi");
    };

    const changeText = function(){
         document.querySelector('h1').innerHTML = "Best JS Practise";
    };

    const chnageMe = setTimeout(changeText, 2000);


    document.querySelector('#stop').addEventListener('click', function(){
        clearTimeout(chnageMe);
        console.log("Stpped");
        
    })
</script>
</html>
