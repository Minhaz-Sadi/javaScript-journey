<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: #212121; color: #fff;">
    0	UNSENT	Client has been created. <br> open() not called yet.
1	OPENED	open() has been called. <br>
2	HEADERS_RECEIVED	send() has been called, and headers and status are available.  <br>
3	LOADING	Downloading; responseText holds partial data. <br>
4	DONE	The operation is complete.
</body>
<script>
    const requestUrl = 'https://api.github.com/users/Minhaz-Sadi';
    const xhr = new XMLHttpRequest(); // data req send or recieve
    xhr.open('GET', requestUrl);
    xhr.onreadystatechange = function(){
            console.log(xhr.readyState);
            if(xhr.readyState == 4){
                // console.log(this.responseText);
                // const data = this.responseText;
                // console.log(typeof data); // data comes string formet
                // console.log(data.followers); // undefined

                // == solution ==

                const data = JSON.parse(this.responseText);
                console.log(typeof data); // object
                console.log(data.followers); // undefined
            }
    }; // if state change,  function change
    
    xhr.send();
</script>
</html>
